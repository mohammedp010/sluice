[project]
name = "sluice"
version = "0.1.0"
description = "A learn-by-building OpenAI-compatible LLM gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "redis>=5",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-exporter-prometheus>=0.51b0",  # only ever published as betas
    "numpy>=1.26",
    "mcp>=1.30,<2",  # MCP proxy: upstream client (stdio + Streamable HTTP); 2.x changed the API
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "openai>=1.40", "ruff>=0.6"]
bench = ["uvloop==0.23.0", "pyinstrument==5.1.1"]  # load generator + profiler (Phase 7)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# S608: SQL built from strings. Every query binds its values; the few that join constant column
# names say so with a noqa. (ADR 0010; LiteLLM's CVE-2026-42208 was a concatenated key check.)
extend-select = ["S608"]
