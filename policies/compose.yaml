# Public model name (what clients send) -> fallback chain of providers.
auth:
  enabled: true
  db_path: /data/sluice.db
  key_ttl: 90d                 # keys made without --ttl expire (ADR 0011)
state:
  backend: redis
  redis_url: redis://redis:6379/0
telemetry:
  traces: otlp
  otlp_endpoint: http://jaeger:4318
  prometheus: true
  ledger: true
cache:                        # semantic cache (needs: ollama pull nomic-embed-text)
  enabled: true
  embed_base_url: http://host.docker.internal:11434/v1
  embed_model: nomic-embed-text
  embed_prefix: "clustering: "
  threshold: 0.895            # from bench/results/cache-eval.md; re-run it before changing
  guard_max_diff: 2
  ttl_s: 3600
limits:
  default_completion_estimate: 256
  paid_daily_call_cap: 50

mcp:                          # Phase 8: MCP tool servers behind /mcp (keys need --tools grants)
  servers: {}                 # e.g. files: {command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/tmp"]}
  allowed_origins: []         # browser Origins allowed to call /mcp

providers:
  mock:
    type: mock
    tokens_per_sec: 50
  ollama:
    type: openai_compat
    base_url: http://host.docker.internal:11434/v1
    timeout_s: 120

routes:
  mock-model:
    cache: true               # opt-in per route
    provider: mock
    upstream_model: mock-1
    # fake prices so budgets can be exercised for free (USD per million tokens)
    price_in_per_mtok: 1000
    price_out_per_mtok: 2000
  local-small:
    deadline_s: 120
    cache: false              # 9% test false hits (cache-eval.md): not yet for real answers
    chain:
      - {provider: ollama, upstream_model: "llama3.2:1b", timeout_s: 60, retries: 1}
      - {provider: mock, upstream_model: mock-1, retries: 0}   # degraded last resort
  auto:                       # Phase 6: cheap model first, re-ask the strong one on bad answers
    deadline_s: 60
    chain:
      - {provider: ollama, upstream_model: "llama3.2:1b", timeout_s: 60, retries: 0,
         price_in_per_mtok: 0.15, price_out_per_mtok: 0.60}     # fake prices: exercise the logic
    escalate_on: [empty, truncated, refusal, invalid_json, repetition]
    escalate:
      deadline_s: 180
      chain:
        - {provider: ollama, upstream_model: "mistral", timeout_s: 180, retries: 0,
           price_in_per_mtok: 2.50, price_out_per_mtok: 10.00}
