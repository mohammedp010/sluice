<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif" font-size="11" role="img" aria-label="Accuracy versus relative cost for each routing policy">
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--s1:#3987e5}}
.t{fill:var(--ink)} .m{fill:var(--ink2)} .g{stroke:var(--grid);stroke-width:1}
</style>
<rect width="720" height="440" fill="var(--bg)"/>
<text class="t" x="56" y="18" font-weight="600">Accuracy vs cost per policy (n=60 prompts, 95% bootstrap CIs)</text>
<line class="g" x1="56" x2="696" y1="388.0" y2="388.0"/><text class="m" x="50" y="392.0" text-anchor="end">60%</text>
<line class="g" x1="56" x2="696" y1="301.0" y2="301.0"/><text class="m" x="50" y="305.0" text-anchor="end">70%</text>
<line class="g" x1="56" x2="696" y1="214.0" y2="214.0"/><text class="m" x="50" y="218.0" text-anchor="end">80%</text>
<line class="g" x1="56" x2="696" y1="127.0" y2="127.0"/><text class="m" x="50" y="131.0" text-anchor="end">90%</text>
<line class="g" x1="56" x2="696" y1="40.0" y2="40.0"/><text class="m" x="50" y="44.0" text-anchor="end">100%</text>
<text class="m" x="56.0" y="404" text-anchor="middle">0×</text>
<text class="m" x="174.9" y="404" text-anchor="middle">0.25×</text>
<text class="m" x="293.9" y="404" text-anchor="middle">0.5×</text>
<text class="m" x="412.8" y="404" text-anchor="middle">0.75×</text>
<text class="m" x="531.7" y="404" text-anchor="middle">1×</text>
<text class="m" x="650.7" y="404" text-anchor="middle">1.25×</text>
<text class="m" x="376.0" y="426" text-anchor="middle">cost relative to always-strong</text>
<line x1="95.3" y1="199.5" x2="531.7" y2="214.0" stroke-dasharray="4 4" style="stroke:var(--ink2)"/>
<text class="m" x="341.4" y="222.8" text-anchor="middle">random escalation</text>
<line x1="95.3" x2="95.3" y1="286.5" y2="127.0" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="87.7" x2="103.5" y1="199.5" y2="199.5" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="95.3" cy="199.5" r="5" style="fill:var(--ink2);stroke:var(--ink2)" stroke-width="2"><title>always cheap: 82% accurate at 0.08× cost, 0% escalated</title></circle>
<text class="t" x="103.3" y="191.5" text-anchor="start">always cheap</text>
<line x1="531.7" x2="531.7" y1="301.0" y2="127.0" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="410.4" x2="665.5" y1="214.0" y2="214.0" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="531.7" cy="214.0" r="5" style="fill:var(--ink2);stroke:var(--ink2)" stroke-width="2"><title>always strong: 80% accurate at 1.00× cost, 100% escalated</title></circle>
<text class="t" x="539.7" y="230.0" text-anchor="start">always strong</text>
<line x1="99.0" x2="99.0" y1="286.5" y2="112.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="88.6" x2="111.8" y1="199.5" y2="199.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="99.0" cy="199.5" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>heuristics: 82% accurate at 0.09× cost, 2% escalated</title></circle>
<text class="t" x="107.0" y="215.5" text-anchor="start">heuristics</text>
<line x1="400.7" x2="400.7" y1="301.0" y2="127.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="281.6" x2="539.3" y1="214.0" y2="214.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="400.7" cy="214.0" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>heuristics + format: 80% accurate at 0.72× cost, 67% escalated</title></circle>
<text class="t" x="400.7" y="236.0" text-anchor="middle">heuristics + format</text>
<line x1="425.4" x2="425.4" y1="214.0" y2="83.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="310.8" x2="568.9" y1="141.5" y2="141.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="425.4" cy="141.5" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>self-consistency (any disagree): 88% accurate at 0.78× cost, 42% escalated</title></circle>
<text class="t" x="433.4" y="133.5" text-anchor="start">self-consistency (any disagree)</text>
<line x1="373.3" x2="373.3" y1="257.5" y2="98.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="258.0" x2="518.5" y1="170.5" y2="170.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="373.3" cy="170.5" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>self-consistency (majority): 85% accurate at 0.67× cost, 23% escalated</title></circle>
<text class="t" x="381.3" y="162.5" text-anchor="start">self-consistency (majority)</text>
<line x1="468.4" x2="468.4" y1="301.0" y2="127.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="365.1" x2="598.4" y1="214.0" y2="214.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="468.4" cy="214.0" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>1B judge: 80% accurate at 0.87× cost, 87% escalated</title></circle>
<text class="t" x="468.4" y="202.0" text-anchor="middle">1B judge</text>
<line x1="249.7" x2="249.7" y1="286.5" y2="127.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="175.3" x2="351.1" y1="199.5" y2="199.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="249.7" cy="199.5" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>1B judge on 50%: 82% accurate at 0.41× cost, 38% escalated</title></circle>
<text class="t" x="257.7" y="191.5" text-anchor="start">1B judge on 50%</text>
<line x1="181.1" x2="181.1" y1="156.0" y2="54.5" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="125.9" x2="261.3" y1="98.0" y2="98.0" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="181.1" cy="98.0" r="5" style="fill:var(--bg);stroke:var(--ink2)" stroke-width="2"><title>oracle (upper bound): 93% accurate at 0.26× cost, 18% escalated</title></circle>
<text class="t" x="189.1" y="102.0" text-anchor="start">oracle (upper bound)</text>
</svg>
