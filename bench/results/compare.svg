<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 322" font-family="system-ui, -apple-system, sans-serif" font-size="11" role="img" aria-label="Latency percentiles versus request rate for direct, Sluice and LiteLLM">
