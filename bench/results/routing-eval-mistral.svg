<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="system-ui, -apple-system, sans-serif" font-size="11" role="img" aria-label="Accuracy versus relative cost for each routing policy">
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--s1:#2a78d6}@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--s1:#3987e5}}
.t{fill:var(--ink)} .m{fill:var(--ink2)} .g{stroke:var(--grid);stroke-width:1}
</style>
<rect width="720" height="450" fill="var(--bg)"/>
<text class="t" x="56" y="18" font-weight="600">Accuracy vs cost per policy (n=60 prompts, 95% bootstrap CIs)</text>
<line class="g" x1="56" x2="696" y1="398.0" y2="398.0"/><text class="m" x="50" y="402.0" text-anchor="end">60%</text>
<line class="g" x1="56" x2="696" y1="311.5" y2="311.5"/><text class="m" x="50" y="315.5" text-anchor="end">70%</text>
<line class="g" x1="56" x2="696" y1="225.0" y2="225.0"/><text class="m" x="50" y="229.0" text-anchor="end">80%</text>
<line class="g" x1="56" x2="696" y1="138.5" y2="138.5"/><text class="m" x="50" y="142.5" text-anchor="end">90%</text>
<line class="g" x1="56" x2="696" y1="52.0" y2="52.0"/><text class="m" x="50" y="56.0" text-anchor="end">100%</text>
<text class="m" x="56.0" y="414" text-anchor="middle">0×</text>
<text class="m" x="148.6" y="414" text-anchor="middle">0.25×</text>
<text class="m" x="241.3" y="414" text-anchor="middle">0.5×</text>
<text class="m" x="333.9" y="414" text-anchor="middle">0.75×</text>
<text class="m" x="426.6" y="414" text-anchor="middle">1×</text>
<text class="m" x="519.2" y="414" text-anchor="middle">1.25×</text>
<text class="m" x="611.9" y="414" text-anchor="middle">1.5×</text>
<text class="m" x="376.0" y="436" text-anchor="middle">cost relative to always-strong</text>
<line x1="128.9" y1="210.6" x2="426.6" y2="225.0" stroke-dasharray="4 4" style="stroke:var(--ink2)"/>
<line x1="56" x2="78" y1="32" y2="32" stroke-dasharray="4 4" style="stroke:var(--ink2)"/>
<text class="m" x="84" y="36">random escalation: a check is only worth something above this line · grey = baselines · hollow = oracle</text>
<line x1="128.9" x2="128.9" y1="297.1" y2="138.5" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="114.8" x2="144.1" y1="210.6" y2="210.6" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="128.9" cy="210.6" r="5" style="fill:var(--ink2);stroke:var(--ink2)" stroke-width="2"><title>always cheap: 82% accurate at 0.20× cost, 0% escalated</title></circle>
<text class="t" x="136.9" y="202.6" text-anchor="start">always cheap</text>
<line x1="426.6" x2="426.6" y1="311.5" y2="138.5" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="332.1" x2="530.8" y1="225.0" y2="225.0" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="426.6" cy="225.0" r="5" style="fill:var(--ink2);stroke:var(--ink2)" stroke-width="2"><title>always strong: 80% accurate at 1.00× cost, 100% escalated</title></circle>
<text class="t" x="434.6" y="241.0" text-anchor="start">always strong</text>
<line x1="131.8" x2="131.8" y1="297.1" y2="124.1" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="115.4" x2="149.4" y1="210.6" y2="210.6" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="131.8" cy="210.6" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>heuristics: 82% accurate at 0.20× cost, 2% escalated</title></circle>
<text class="t" x="139.8" y="226.6" text-anchor="start">heuristics</text>
<line x1="366.8" x2="366.8" y1="311.5" y2="138.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="270.1" x2="481.2" y1="225.0" y2="225.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="366.8" cy="225.0" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>heuristics + format: 80% accurate at 0.84× cost, 67% escalated</title></circle>
<text class="t" x="366.8" y="247.0" text-anchor="middle">heuristics + format</text>
<line x1="518.8" x2="518.8" y1="225.0" y2="95.3" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="403.0" x2="665.5" y1="152.9" y2="152.9" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="518.8" cy="152.9" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>self-consistency (any disagree): 88% accurate at 1.25× cost, 42% escalated</title></circle>
<text class="t" x="510.8" y="144.9" text-anchor="end">self-consistency (any disagree)</text>
<line x1="478.2" x2="478.2" y1="268.2" y2="109.7" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="360.3" x2="625.4" y1="181.8" y2="181.8" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="478.2" cy="181.8" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>self-consistency (majority): 85% accurate at 1.14× cost, 23% escalated</title></circle>
<text class="t" x="486.2" y="173.8" text-anchor="start">self-consistency (majority)</text>
<line x1="439.8" x2="439.8" y1="311.5" y2="138.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="355.8" x2="545.4" y1="225.0" y2="225.0" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="439.8" cy="225.0" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>1B judge: 80% accurate at 1.04× cost, 87% escalated</title></circle>
<text class="t" x="439.8" y="213.0" text-anchor="middle">1B judge</text>
<line x1="260.0" x2="260.0" y1="297.1" y2="138.5" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<line x1="194.2" x2="346.6" y1="210.6" y2="210.6" style="stroke:var(--s1)" stroke-width="1.5" opacity="0.5"/>
<circle cx="260.0" cy="210.6" r="5" style="fill:var(--s1);stroke:var(--s1)" stroke-width="2"><title>1B judge on 50%: 82% accurate at 0.55× cost, 38% escalated</title></circle>
<text class="t" x="268.0" y="202.6" text-anchor="start">1B judge on 50%</text>
<line x1="195.7" x2="195.7" y1="167.3" y2="66.4" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<line x1="148.2" x2="263.6" y1="109.7" y2="109.7" style="stroke:var(--ink2)" stroke-width="1.5" opacity="0.5"/>
<circle cx="195.7" cy="109.7" r="5" style="fill:var(--bg);stroke:var(--ink2)" stroke-width="2"><title>oracle (upper bound): 93% accurate at 0.38× cost, 18% escalated</title></circle>
<text class="t" x="203.7" y="113.7" text-anchor="start">oracle (upper bound)</text>
</svg>
