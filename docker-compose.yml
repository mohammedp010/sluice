# Two gateway replicas sharing one Redis: limits must hold across both.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  jaeger:                          # traces: UI on http://localhost:16686 (in-memory storage)
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686", "4318:4318"]   # 4318 = OTLP/HTTP, so a local gateway can export too
  gateway-1: &gw
    build: .
    environment:
      SLUICE_POLICY: /app/policies/compose.yaml
    volumes:
      - ./policies:/app/policies:ro
      - ./data:/data               # shared sqlite key store
    depends_on: [redis, jaeger]
    ports: ["8001:8000"]
  gateway-2:
    <<: *gw
    ports: ["8002:8000"]
